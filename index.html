    <title>日式燒烤模擬器</title>
    <style>
      /* shown until the app takes over #root, so a slow first load is never a blank screen */
      /* the same look as the loading board the app shows next (ui/LoadingScreen): a dark wooden board, the shop's name in the sign's lettering */
      #boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; text-align: center;
        background: radial-gradient(ellipse at 50% 40%, #3a2618 0%, #1c120b 70%); color: #e8d6b4; font: 13px/1.5 system-ui, sans-serif; }
      #boot .board { display: grid; justify-items: center; gap: 6px; padding: 26px 46px 22px; border-radius: 14px;
        background: linear-gradient(#5a3a22, #3e2716); border: 2px solid #2a1a0f; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.12), 0 14px 32px -12px rgb(0 0 0 / 0.7); }
      #boot b { font: 400 46px/1 'Zen Antique', serif; letter-spacing: 0.12em; color: #f6e7c8; text-shadow: 0 2px 0 #1c110a, 0 0 18px rgb(242 196 109 / 0.25); }
      #boot small { font: 400 13px 'Zen Antique', serif; letter-spacing: 0.4em; color: #d9c29a; margin-bottom: 10px; }
      #boot .bar { width: 220px; height: 8px; border-radius: 4px; background: rgb(0 0 0 / 0.35); overflow: hidden; }
      #boot .bar::after { content: ''; display: block; width: 35%; height: 100%; border-radius: 4px; background: linear-gradient(#fbf3e4, #e9d8b6);
        animation: boot-slide 1.4s ease-in-out infinite; }
      #boot i { font-style: normal; letter-spacing: 0.08em; margin-top: 4px; }
      #boot button { display: none; padding: 7px 22px; border: 1px solid #2a1a0f; border-radius: 8px; background: #fbf3e4; color: #3b2a20;
        font: inherit; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; box-shadow: 0 3px 0 #2a1a0f; }
      #boot.is-stuck button { display: block; }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
      /* fish emblem */
      #boot .fish-emblem { width: min(300px, 64vw); height: auto; margin-bottom: -10px; overflow: visible; filter: drop-shadow(0 12px 22px rgb(0 0 0 / 0.5)); }
      #boot .fish-emblem .fe-flames path { transform-box: fill-box; transform-origin: 50% 100%; animation: fe-flick 1.1s ease-in-out infinite alternate; }
      #boot .fish-emblem .fe-f2 { animation-duration: 0.8s !important; animation-delay: -0.3s !important; }
      #boot .fish-emblem .fe-f3 { animation-duration: 1.3s !important; animation-delay: -0.6s !important; }
      #boot .fish-emblem .fe-sparks circle { opacity: 0; animation: fe-spark 2.4s ease-out infinite; }
      #boot .fish-emblem .fe-fish { animation: fe-bob 3s ease-in-out infinite; transform-origin: 150px 100px; }
      #boot .fish-emblem .fe-steam path { opacity: 0; animation: fe-steam 2.4s ease-out infinite; }
      #boot .fish-emblem .fe-bars { opacity: calc((var(--done, 0) - 0.3) * 1.1); }
      #boot .fish-emblem .fe-crust { opacity: calc(0.2 + var(--done, 0) * 0.7); }
      #boot .fish-emblem .fe-salt { opacity: calc(0.35 + var(--done, 0) * 0.6); }
      @keyframes fe-flick { 0% { transform: scale(1, 1); } 50% { transform: scale(0.94, 1.08) skewX(2deg); } 100% { transform: scale(1.04, 0.95) skewX(-2deg); } }
      @keyframes fe-spark { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 0), -70px); } }
      @keyframes fe-bob { 50% { transform: translateY(-2px) rotate(-0.8deg); } }
      @keyframes fe-steam { 0% { opacity: 0; transform: translateY(8px); } 35% { opacity: 0.75; } 100% { opacity: 0; transform: translateY(-14px); } }
      @media (prefers-reduced-motion: reduce) { #boot .fish-emblem * { animation: none !important; } }
      /* end fish emblem */
    </style>
    <script>
      // a script that fails to load (an old cached page pointing at files a newer deploy replaced): fetch the
      // page afresh, once
      window.addEventListener('error', function (e) {
        var t = e.target
        if (!t || t.tagName !== 'SCRIPT') return
        try {
          if (sessionStorage.getItem('canteen-boot-retry')) return
          sessionStorage.setItem('canteen-boot-retry', '1')
        } catch (err) { /* storage blocked */ }
        location.replace(location.pathname + '?v=' + Date.now())
      }, true)
      // still nothing after a while: offer a reload
      setTimeout(function () {
        var b = document.getElementById('boot')
        if (b) b.className = 'is-stuck'
      }, 25000)
    </script>

    <!-- retro Mincho for the shop signs, subset to just their characters -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Antique&text=0123456789%C2%A5%E3%81%84%E3%81%8A%E3%81%8F%E3%81%94%E3%81%97%E3%81%9B%E3%81%9F%E3%81%A3%E3%81%B5%E3%81%BE%E3%81%BF%E3%82%83%E3%82%89%E3%82%A4%E3%82%B3%E3%82%B7%E3%82%BF%E3%83%8D%E3%83%8F%E3%83%93%E3%83%9C%E3%83%9F%E3%83%A0%E3%83%A5%E3%83%A9%E3%83%AB%E3%83%AC%E3%83%BC%E4%B9%B3%E4%BB%A4%E4%BC%9A%E5%82%99%E5%85%A9%E5%89%B5%E5%8C%85%E5%8D%83%E5%99%A8%E5%A0%82%E5%A4%9C%E5%A5%B3%E5%B1%91%E5%B7%9E%E5%B8%B3%E5%BB%81%E5%BC%8F%E6%89%8B%E6%93%AC%E6%96%99%E6%97%A5%E6%A5%AD%E6%A8%A1%E6%B2%B8%E6%B4%97%E6%B7%B1%E6%B8%85%E7%81%AB%E7%82%AD%E7%83%8F%E7%83%A4%E7%84%BC%E7%87%92%E7%8F%88%E7%90%B2%E7%94%9F%E7%94%B2%E7%94%B7%E7%B2%97%E7%B4%80%E7%B5%90%E7%BC%B6%E8%81%9E%E8%8C%B6%E8%8F%8C%E8%90%AC%E8%99%95%E8%A8%88%E9%85%92%E9%85%B8%E9%87%8E%E9%8A%98%E9%8D%8B%E9%95%B7%E9%A3%9F%E9%A3%B2%E9%A3%BD%E9%AD%9A%E9%BA%B5%E9%BC%8E%E9%BE%8D%E3%83%89%E3%83%AA%E3%83%B3%E3%82%AF%C2%B7MENWO%E9%A1%9E%E7%89%9B%E3%82%B9%E3%83%9D%E3%83%84%E3%83%81&display=swap" rel="stylesheet" />
    <title>日式燒烤模擬器</title>
    <style>
      /* shown until the app takes over #root, so a slow first load is never a blank screen */
      #boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center;
        background: #e9eef5; color: #3b2a20; font: 16px/1.5 system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) { #boot { background: #171c27; color: #f1e6cf; } }
      #boot b { display: inline-block; padding: 6px 18px; border-radius: 6px; background: #8f2a20; color: #ffe9c7;
        font: 700 28px/1.3 serif; letter-spacing: 0.2em; box-shadow: 0 6px 16px -6px rgb(0 0 0 / 0.5); }
      #boot i { font-style: normal; opacity: 0.7; animation: boot-dim 1.4s ease-in-out infinite; }
      #boot button { display: none; margin: 0 auto; padding: 8px 18px; border: 0; border-radius: 999px;
        background: #e8742a; color: #fff; font: inherit; }
      #boot.is-stuck button { display: block; }
      @keyframes boot-dim { 50% { opacity: 0.3; } }
    </style>
    <script>
      // a script that fails to load (an old cached page pointing at files a newer deploy replaced): fetch the
      // page afresh, once
      window.addEventListener('error', function (e) {
        var t = e.target
        if (!t || t.tagName !== 'SCRIPT') return
        try {
          if (sessionStorage.getItem('canteen-boot-retry')) return
          sessionStorage.setItem('canteen-boot-retry', '1')
        } catch (err) { /* storage blocked */ }
        location.replace(location.pathname + '?v=' + Date.now())
      }, true)
      // still nothing after a while: offer a reload
      setTimeout(function () {
        var b = document.getElementById('boot')
        if (b) b.className = 'is-stuck'
      }, 25000)
    </script>
  </head>
  <body>
    <div id="root"><div id="boot"><b>日式燒烤模擬器</b><i>準備中…</i>
      <button type="button" onclick="location.replace(location.pathname + '?v=' + Date.now())">重新載入</button></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
